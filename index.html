<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tinkerbell — React Component Showcase</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="background: var(--color-bg); padding: 2rem 1rem;">
  <div style="text-align: center; margin-bottom: 2rem;">
    <a href="../index.html" class="btn btn-secondary btn-sm" style="margin-bottom: 1rem;">← Return to Main Website</a>
    <h1 style="font-family: var(--font-serif); font-size: 2.4rem;">Tinkerbell React Version</h1>
    <p style="color: var(--color-botanical-muted);">Demonstration of React 18 integration for the college mini-project.</p>
  </div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [flowers, setFlowers] = useState([
        { id: 'rose', name: 'Red Rose', meaning: 'Passionate Love', qty: 2 },
        { id: 'tulip', name: 'Tulip', meaning: 'Declaration of Perfect Love', qty: 1 },
        { id: 'baby', name: "Baby's Breath", meaning: 'Everlasting Devotion', qty: 3 }
      ]);
      const [recipient, setRecipient] = useState('');
      const [occasion, setOccasion] = useState('Friendship');
      const [message, setMessage] = useState('');
      const [giftCode, setGiftCode] = useState(null);

      const addStem = (id) => {
        setFlowers(prev => prev.map(f => f.id === id ? { ...f, qty: f.qty + 1 } : f));
      };

      const removeStem = (id) => {
        setFlowers(prev => prev.map(f => f.id === id ? { ...f, qty: Math.max(0, f.qty - 1) } : f).filter(f => f.qty > 0));
      };

      const handleCreate = (e) => {
        e.preventDefault();
        if (!recipient || !message) return;
        const code = 'TINK-' + Math.random().toString(36).substring(2, 8).toUpperCase();
        setGiftCode(code);
      };

      return (
        <div style={{ maxWidth: '640px', margin: '0 auto', background: '#FFFFFF', padding: '2.5rem', borderRadius: '24px', boxShadow: '0 8px 30px rgba(0,0,0,0.06)', border: '1px solid #E3DDD3' }}>
          {giftCode ? (
            <div style={{ textAlign: 'center', padding: '2rem 1rem' }}>
              <div style={{ fontSize: '3rem', marginBottom: '1rem' }}>✨</div>
              <h2 style={{ fontFamily: 'Playfair Display, serif', color: '#203525', marginBottom: '0.5rem' }}>Bouquet Encrypted</h2>
              <p style={{ color: '#5C7060', marginBottom: '1.5rem' }}>Share this secret code with <strong>{recipient}</strong>:</p>
              <div style={{ fontSize: '2rem', fontWeight: 'bold', letterSpacing: '0.15em', color: '#C59E3F', background: '#FAF7F2', padding: '0.8rem 1.5rem', borderRadius: '999px', display: 'inline-block', border: '1px solid #E3DDD3', marginBottom: '1.5rem' }}>
                {giftCode}
              </div>
              <div>
                <button onClick={() => { setGiftCode(null); setRecipient(''); setMessage(''); }} className="btn btn-primary">
                  Craft Another Bouquet
                </button>
              </div>
            </div>
          ) : (
            <form onSubmit={handleCreate}>
              <h3 style={{ fontFamily: 'Playfair Display, serif', marginBottom: '1.5rem', fontSize: '1.5rem', color: '#203525' }}>
                React State-Driven Bouquet Composer
              </h3>

              <div style={{ marginBottom: '1.25rem' }}>
                <label style={{ display: 'block', fontSize: '0.85rem', fontWeight: 600, marginBottom: '0.3rem' }}>Recipient Name *</label>
                <input 
                  type="text" 
                  value={recipient} 
                  onChange={e => setRecipient(e.target.value)} 
                  required 
                  className="form-input" 
                  placeholder="e.g. Clara"
                />
              </div>

              <div style={{ marginBottom: '1.25rem' }}>
                <label style={{ display: 'block', fontSize: '0.85rem', fontWeight: 600, marginBottom: '0.5rem' }}>
                  Stems Included ({flowers.reduce((acc, f) => acc + f.qty, 0)} total stems)
                </label>
                <div style={{ background: '#FAF7F2', borderRadius: '12px', padding: '0.75rem', border: '1px solid #E3DDD3' }}>
                  {flowers.map(f => (
                    <div key={f.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '0.5rem 0', borderBottom: '1px solid #E8E2D8' }}>
                      <div>
                        <div style={{ fontWeight: 600, fontSize: '0.9rem' }}>{f.name}</div>
                        <div style={{ fontSize: '0.75rem', fontStyle: 'italic', color: '#6C8B74' }}>{f.meaning}</div>
                      </div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                        <button type="button" onClick={() => removeStem(f.id)} className="qty-btn">−</button>
                        <span style={{ fontWeight: 600, minWidth: '20px', textAlign: 'center' }}>{f.qty}</span>
                        <button type="button" onClick={() => addStem(f.id)} className="qty-btn">+</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{ marginBottom: '1.5rem' }}>
                <label style={{ display: 'block', fontSize: '0.85rem', fontWeight: 600, marginBottom: '0.3rem' }}>Personal Secret Message *</label>
                <textarea 
                  value={message} 
                  onChange={e => setMessage(e.target.value)} 
                  required 
                  className="form-textarea" 
                  rows="3" 
                  placeholder="Write personal letter..."
                />
              </div>

              <button type="submit" className="btn btn-primary" style={{ width: '100%' }}>
                Craft Bouquet (React State) ✨
              </button>
            </form>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
